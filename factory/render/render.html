<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#ECEAE6}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
// Studio renderer for Safehouse products. Query: g=<glb url> az el zoom tx ty tz rake
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const q=new URLSearchParams(location.search), n=k=>+(q.get(k)||0);
const az=n('az'), el=n('el'), zoom=+(q.get('zoom')||1), tx=n('tx'), ty=n('ty'), tz=n('tz'), rake=q.get('rake')==='1';
const W=1600,H=1200, r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H); r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap;
r.toneMapping=THREE.ACESFilmicToneMapping; r.outputColorSpace=THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const s=new THREE.Scene(); s.background=new THREE.Color('#ECEAE6');
const pm=new THREE.PMREMGenerator(r); s.environment=pm.fromScene(new RoomEnvironment(),0.04).texture; s.environmentIntensity=0.35;
const key=new THREE.DirectionalLight(0xffffff,2.2); key.position.set(-0.25,0.45,0.35);
if(rake){key.position.set(-0.45,0.05,-0.12); key.intensity=3.2;}
key.castShadow=true; key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-.2,right:.2,top:.2,bottom:-.2,near:.01,far:2}); key.shadow.radius=6; key.shadow.bias=-0.0004; s.add(key);
const fill=new THREE.DirectionalLight(0xffffff,0.6); fill.position.set(0.4,0.2,0.3); s.add(fill);
const g=new THREE.Mesh(new THREE.PlaneGeometry(3,3),new THREE.ShadowMaterial({opacity:0.18})); g.rotation.x=-Math.PI/2; g.receiveShadow=true; s.add(g);
new GLTFLoader().load(q.get('g'),gl=>{
  const o=gl.scene; o.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true;}}); s.add(o);
  const b=new THREE.Box3().setFromObject(o), c=b.getCenter(new THREE.Vector3()), sz=b.getSize(new THREE.Vector3());
  o.position.x-=c.x; o.position.z-=c.z; o.position.y-=b.min.y; c.set(tx*sz.x, sz.y/2+ty*sz.y, tz*sz.z);
  const cam=new THREE.PerspectiveCamera(28,W/H,0.001,10), R=(sz.length()/2)/Math.sin(THREE.MathUtils.degToRad(14))*1.08/zoom;
  const a=THREE.MathUtils.degToRad(az), e=THREE.MathUtils.degToRad(el);
  cam.position.set(c.x+R*Math.sin(a)*Math.cos(e), c.y+R*Math.sin(e), c.z+R*Math.cos(a)*Math.cos(e)); cam.lookAt(c);
  r.render(s,cam); document.title='done';
}, undefined, err=>{document.title='error:'+err});
</script></body></html>
