<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Safe House — Kigali</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0d0d0d] text-[#F4F1EA] font-sans">

    <nav class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center border-b border-white/10 text-xs font-mono">
        <span class="font-bold tracking-widest uppercase">The Safe House</span>
        <div class="flex gap-6 items-center">
            <a href="#catalog" class="hover:text-purple-400">Storefront</a>
            <a href="#archives" class="hover:text-purple-400">Calculators & Ideas</a>
            <button onclick="toggleAdmin()" class="px-3 py-1.5 rounded-full border border-white/20 hover:bg-white hover:text-black uppercase">
                Admin Portal
            </button>
        </div>
    </nav>

    <div id="storefront-view" class="max-w-7xl mx-auto px-6 py-12">
        <header class="mb-12">
            <span class="text-[10px] font-mono text-purple-400 uppercase tracking-widest">[ KIGALI 3D FABRICATION ]</span>
            <h1 class="text-4xl font-serif font-bold uppercase mt-2">Active Artifacts</h1>
        </header>

        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
            </div>
    </div>

    <div id="admin-view" class="max-w-4xl mx-auto px-6 py-12 hidden">
        <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
            <h2 class="text-xl font-mono uppercase font-bold">Admin Manager</h2>
            <button onclick="toggleAdmin()" class="text-xs font-mono underline">← Back to Storefront</button>
        </div>
        <form onsubmit="addProduct(event)" class="bg-neutral-900 p-6 rounded-2xl border border-white/10 space-y-4 text-xs font-mono">
            <div>
                <label class="block opacity-70 mb-1">Product Name</label>
                <input id="p-name" required class="w-full p-2.5 rounded bg-black border border-white/20 text-white" />
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block opacity-70 mb-1">Category</label>
                    <input id="p-cat" value="Lighting" class="w-full p-2.5 rounded bg-black border border-white/20 text-white" />
                </div>
                <div>
                    <label class="block opacity-70 mb-1">Price (RWF)</label>
                    <input id="p-price" type="number" value="20000" class="w-full p-2.5 rounded bg-black border border-white/20 text-white" />
                </div>
            </div>
            <div>
                <label class="block opacity-70 mb-1">Image URL / Data</label>
                <input id="p-img" placeholder="Paste image link or Data URL" class="w-full p-2.5 rounded bg-black border border-white/20 text-white" />
            </div>
            <button type="submit" class="w-full py-3 bg-purple-600 text-white font-bold uppercase rounded">Publish Artifact</button>
        </form>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('sh_products')) || [
            { id: 1, name: 'Geodesic Planter', category: 'Decor', price: 15000, img: '' }
        ];

        function renderStore() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(p => `
                <div class="bg-[#141414] border border-white/10 rounded-2xl overflow-hidden flex flex-col justify-between">
                    <div class="h-48 bg-neutral-900 flex items-center justify-center text-xs font-mono opacity-50 overflow-hidden">
                        ${p.img ? `<img src="${p.img}" class="w-full h-full object-cover">` : '[ No Image ]'}
                    </div>
                    <div class="p-4">
                        <span class="text-[9px] font-mono text-purple-400 uppercase">${p.category}</span>
                        <h3 class="text-base font-serif font-bold uppercase">${p.name}</h3>
                    </div>
                    <div class="p-4 pt-0 flex justify-between items-center border-t border-white/5 mt-2">
                        <span class="font-mono text-xs font-bold">${p.price.toLocaleString()} RWF</span>
                        <button onclick="alert('Order request for ${p.name} noted!')" class="px-3 py-1.5 bg-white text-black text-[10px] font-bold uppercase rounded-full">Acquire</button>
                    </div>
                </div>
            `).join('');
        }

        function toggleAdmin() {
            document.getElementById('storefront-view').classList.toggle('hidden');
            document.getElementById('admin-view').classList.toggle('hidden');
        }

        function addProduct(e) {
            e.preventDefault();
            const newItem = {
                id: Date.now(),
                name: document.getElementById('p-name').value,
                category: document.getElementById('p-cat').value,
                price: Number(document.getElementById('p-price').value),
                img: document.getElementById('p-img').value
            };
            products.unshift(newItem);
            localStorage.setItem('sh_products', JSON.stringify(products));
            renderStore();
            toggleAdmin();
        }

        renderStore();
    </script>
</body>
</html>
